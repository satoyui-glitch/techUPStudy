<!DOCTYPE HTML>
<html lang="ja">
<head>
<meta charset="UTF-8" />
  <title>いろんなメソッド</title>
</head>
<body>
  <script>
    function clock(){
      const now = new Date();

      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();

      if(hours < 10){
        hours = '0' + hours;
      }
      if(minutes < 10){
        minutes = '0' + minutes;
      }
      if(seconds < 10){
        seconds = '0' + seconds;
      }

      console.log(hours + ':' + minutes + ':' +seconds);
    }

    setInterval(clock, 1000);
  </script>
</body>
</html>
