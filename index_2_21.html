<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>アニメーションを使う</title>
        <style>
            .tab-input{
                display: none;
            }

            .tab-buttons{
                display: flex;
                gap: 20px;
                margin-bottom: 20px;
            }

            .tab-label{
                display: block;
                padding: 10px 60px;
                color: gray;
                background-color: rgba(128, 128, 128, 0.464);
                cursor: pointer;
                text-align: center;
                font-size: 15px;
            }

            .tab-content{
                display: none;
                font-size: 20px;
            }

            #tab1:checked ~ .tab-buttons label[for="tab1"],
            #tab2:checked ~ .tab-buttons label[for="tab2"],
            #tab3:checked ~ .tab-buttons label[for="tab3"]{
                background-color: white;
                color: black;
            }

            #tab1:checked ~ .tab-contents #content1,
            #tab2:checked ~ .tab-contents #content2,
            #tab3:checked ~ .tab-contents #content3{
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="tab-container">
            <input type="radio" id="tab1" name="test1" class="tab-input">
            <input type="radio" id="tab2" name="test1" class="tab-input">
            <input type="radio" id="tab3" name="test1" class="tab-input">
                <div class="tab-buttons">
                    <label for="tab1" class="tab-label">タブ1</label>
                    <label for="tab2" class="tab-label">タブ2</label>
                    <label for="tab3" class="tab-label">タブ3</label>
                </div>
                    <div class="tab-contents">
                        <div id="content1" class="tab-content">タブパネル-1</div>
                        <div id="content2" class="tab-content">タブパネル-2</div>
                        <div id="content3" class="tab-content">タブパネル-3</div>
                    </div>
        </div>
    </body>
</html>
