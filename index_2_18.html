<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>擬似要素、擬似クラス</title>
        <style>
            .sample{
                font-size: 30px;
                cursor: crosshair;
            }
            a:hover{
                color: red;
                background-color: yellow;
            }
            a:link{
                color: blue;
            }
            a:visited{
                color: purple;
            }
            a:active{
                color: red;
            }
            input:checked + label{
                color: red;
                font-size: 50px;
            }
        </style>
    </head>
    <body>
        <div>
            <a class="sample" href="https://techup.shop">サンプルリンク</a>
        </div>

        <div>
            <h1>あなたは人間ですか？</h1>
            <input type="radio" name="test" id="yes" value="yes" />
            <label for="yes">はい</label>

            <input type="radio" name="test" id="no" value="no" />
            <label for="no">いいえ</label>
        </div>

        <div>
            <h1>犬派？猫派？</h1>
            <input type="checkbox" name="box" id="opt-in" />
            <label for="opt-in">犬</label><br>
            <input type="checkbox" name="box" id="opt-in" />
            <label for="opt-in">猫</label>
        </div>
    </body>
</html>
