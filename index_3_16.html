<!DOCTYPE HTML>
<html lang="ja">
<head>
<meta charset="UTF-8" />
  <title>DOM(Document Object Model)</title>
</head>
<body>
  <ul class = "list-group">
    <li class = "list-group-item">100</li>
    <li class="list-group-item">110</li>
    <li class="list-group-item">120</li>
    <li class="list-group-item">130</li>
    <li class="list-group-item">140</li>
  </ul>

  <button id = "change-btn">変更</button>
  <button id = "reset-btn">リセット</button>

    <script>
      var ul = document.querySelector('.list-group');

      var listItems =document.querySelectorAll('.list-group-item');

      var initialValues =[];

      listItems.forEach(function(li){
        initialValues.push(parseInt(li.textContent));
      });

      document.getElementById('change-btn').addEventListener('click', function(){

        var items = document.querySelectorAll('.list-group-item');

        for (var i = 0; i < items.length; i++){
          var value = parseInt(items[i].textContent);
          items[i].textContent = value * 10;
        }
      });

      document.getElementById('reset-btn').addEventListener('click', function(){
        var items = document.querySelectorAll('.list-group-item');
      
        items. forEach(function(item, index){
          item.textContent = initialValues[index];
        });
      });
    </script>
</body>
</html>
